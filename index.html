<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LambanoChile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#020b14;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
header{height:92px;display:flex;align-items:center;padding:0 28px;background:#020912;border-bottom:1px solid rgba(25,200,255,.18);position:relative;z-index:5}
.logo{color:#fff;font-size:clamp(25px,7vw,42px);font-weight:900;letter-spacing:-1px;white-space:nowrap}
.logo span{color:#19c8ff}
.hero{position:relative;width:100%;min-height:calc(100vh - 92px);background:#020b14;display:flex;flex-direction:column;justify-content:flex-end}
.hero-image{width:100%;height:auto;min-height:calc(100vh - 92px);object-fit:cover;object-position:center top;display:block}
.hero-action{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);z-index:2}
.hero-action a{display:inline-block;padding:18px 34px;border-radius:40px;background:#19c8ff;color:#031018;text-decoration:none;font-size:17px;font-weight:800;white-space:nowrap;box-shadow:0 8px 25px rgba(0,0,0,.35)}
@media(max-width:600px){header{height:82px;padding:0 18px}.hero{min-height:calc(100vh - 82px)}.hero-image{min-height:calc(100vh - 82px);object-position:center top}.hero-action{bottom:24px}.hero-action a{font-size:15px;padding:16px 25px}}
</style>
</head>
<body>
<header><div class="logo">LAMBANO<span>CHILE</span>.COM</div></header>
<main class="hero">
<img class="hero-image" src="lambanochile.jpg" alt="LambanoChile">
<div class="hero-action"><a href="#contenido">ENTRAR A LAMBANOCHILE</a></div>
</main>
<div id="contenido"></div>
</body>
</html>
